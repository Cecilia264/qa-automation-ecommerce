[pytest]
# Directory layout
testpaths = tests
pythonpath = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Reporting and strictness
addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings

# Playwright configuration
# Override the target environment with: pytest --base-url https://staging.example.com
base_url = https://www.saucedemo.com

# Custom markers (registered to keep --strict-markers happy)
markers =
    smoke: critical path tests, fast and stable
    ui: browser-driven tests (Playwright)
    api: tests against the HTTP API layer
    e2e: end-to-end user journeys spanning multiple modules
    slow: long-running tests, excluded from the default feedback loop
    regression: full regression suite

# Logging
log_cli = false
log_cli_level = INFO
log_file = reports/pytest.log
log_file_level = INFO
log_file_format = %(asctime)s [%(levelname)s] %(name)s: %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

# Output artifacts
junit_family = xunit2
